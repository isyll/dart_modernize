include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  # Golden fixtures are deliberate "before/after" snapshots: inputs hold
  # non-idiomatic code on purpose, and expected outputs use language features
  # newer than this package's own version. They are specs, not project sources.
  exclude:
    - test/fixtures/**

linter:
  rules:
    - avoid_bool_literals_in_conditional_expressions
    - avoid_catches_without_on_clauses
    - avoid_catching_errors
    - avoid_unused_constructor_parameters
    - cancel_subscriptions
    - close_sinks
    - no_adjacent_strings_in_list
    - prefer_final_in_for_each
    - prefer_final_locals
    - unawaited_futures
    - unnecessary_await_in_return
