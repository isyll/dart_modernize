version: 0.1.0
repository: https://github.com/isylla/dart_modernize

environment:
  sdk: '>=3.12.0 <4.0.0'

executables:
  dart_modernize: dart_modernize

dependencies:
  args: ^2.5.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
