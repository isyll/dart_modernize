name: Bug Report
description: Something isn't working as expected
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Fill in all required fields so we can reproduce and fix it quickly.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. Include the command you ran and the output you got.
      placeholder: |
        $ dart_modernize lib/
        Error: ...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest Dart file or command that triggers the bug.
      render: dart
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: dart_modernize version
      placeholder: "0.1.0  (run: dart_modernize --version)"
    validations:
      required: true

  - type: input
    id: dart-sdk
    attributes:
      label: Dart SDK version
      placeholder: "3.13.x  (run: dart --version)"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      multiple: true
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Stack traces, related issues, screenshots, or anything else that helps.
