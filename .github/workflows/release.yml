name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Reuse the exact test suite from ci.yml so the tagged commit is validated
  # once, here, right before publishing. CI does not run on pushes to main, so
  # this is the only place the release commit is tested, and publish depends on
  # it: a red tree can never reach pub.dev.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release
      id-token: write # required for pub.dev publish
    steps:
      - uses: actions/checkout@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check whether this version is already on pub.dev
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pub.dev/api/packages/dart_modernize/versions/$version")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to pub.dev
        if: steps.published.outputs.exists == 'false'
        run: dart pub publish --force

      # Pull this version's section out of the changelog into a file, so its
      # markdown (backticks, angle brackets) is never run through a shell.
      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## ${version}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md
