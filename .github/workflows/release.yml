name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # CI already tests every commit that lands on main; no need to re-run here.
  # This job waits for CI to pass on the same SHA before publishing.
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # required for pub.dev publish
      actions: read   # required to poll CI workflow status
    steps:
      - uses: actions/checkout@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Wait for CI to pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="${{ github.sha }}"
          repo="${{ github.repository }}"
          echo "Waiting for CI to complete on $sha..."
          for i in $(seq 1 40); do
            run=$(gh api "repos/$repo/actions/workflows/ci.yml/runs?head_sha=$sha" \
              --jq '.workflow_runs[0] // empty')
            if [ -z "$run" ]; then
              echo "CI run not found yet (attempt $i/40)"
              sleep 30
              continue
            fi
            status=$(echo "$run" | jq -r '.status')
            conclusion=$(echo "$run" | jq -r '.conclusion')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI passed"
                exit 0
              else
                echo "CI did not pass: $conclusion"
                exit 1
              fi
            fi
            echo "CI is $status (attempt $i/40)"
            sleep 30
          done
          echo "Timed out waiting for CI after 20 minutes"
          exit 1

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check whether this version is already on pub.dev
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pub.dev/api/packages/dart_modernize/versions/$version")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to pub.dev
        if: steps.published.outputs.exists == 'false'
        run: dart pub publish --force

      # Pull this version's section out of the changelog into a file, so its
      # markdown (backticks, angle brackets) is never run through a shell.
      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## ${version}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md
