name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  # Reuse the exact test suite from ci.yml so the tagged commit is validated
  # once, here, right before publishing. CI does not run on pushes to main, so
  # this is the only place the release commit is tested, and publish depends on
  # it: a red tree can never reach pub.dev.
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the GitHub Release
      id-token: write # required for pub.dev publish
    steps:
      - uses: actions/checkout@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Check whether this version is already on pub.dev
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://pub.dev/api/packages/dart_modernize/versions/$version")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish to pub.dev
        if: steps.published.outputs.exists == 'false'
        run: dart pub publish --force

      # Pull this version's section out of the changelog into a file, so its
      # markdown (backticks, angle brackets) is never run through a shell.
      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk "/^## ${version}/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > release_notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release_notes.md

  # Standalone executables attached to the GitHub Release. Compiled ahead of
  # time, the analyzer uses far smaller stack frames than under the JIT of
  # `dart pub global activate`, so a deeply nested generated expression that
  # can crash the JIT build resolves fine. They still need a Dart SDK on the
  # machine (found through DART_SDK, FLUTTER_ROOT, or dart on the PATH): the
  # tool analyzes against it and runs dart format, fix and analyze from it.
  # Runs only on a release tag, after the package is published.
  binaries:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: dart_modernize-linux-x64
          - os: windows-latest
            asset: dart_modernize-windows-x64.exe
          - os: macos-latest
            asset: dart_modernize-macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # required to upload to the GitHub Release
    steps:
      - uses: actions/checkout@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - run: dart pub get
      - run: dart compile exe bin/dart_modernize.dart -o ${{ matrix.asset }}

      - name: Attach to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber
