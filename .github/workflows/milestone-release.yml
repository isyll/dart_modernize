name: Milestone release

# When the last open issue of a milestone is closed, this workflow writes a
# CHANGELOG section listing every issue in that milestone, bumps the version in
# all three places, commits to main, and pushes a vX.Y.Z tag. The tag push is
# what triggers release.yml, which runs the tests on the tagged commit and does
# the actual pub.dev publish. This workflow never publishes or creates a GitHub
# Release itself, so it does not overlap with release.yml, and pushing a tag by
# hand still works exactly as before.
#
# The commit to main triggers no workflow of its own (CI does not run on pushes
# to main); the tagged commit is tested by release.yml before it ships.
#
# Safety rules enforced before anything is written or pushed:
#   1. The milestone must have zero open issues.
#   2. The milestone title must be a X.Y.Z version.
#   3. The version must be strictly newer than the current version, taken as the
#      newest of: the latest vX.Y.Z tag, the top CHANGELOG heading, and the
#      pubspec version. This blocks re-releasing a version that is already
#      released, reached, or exceeded, and blocks going backwards.
#   4. The version must be the lowest milestone that is still ahead of that
#      baseline, so milestones release in order (0.9.0 before 0.10.0).
#
# The tag is pushed with the RELEASE_PAT secret, not the default GITHUB_TOKEN. A
# push made with GITHUB_TOKEN does not start other workflows, so without a PAT
# the tag push would not start release.yml and the release would stall.
# RELEASE_PAT must be a token that can push to main and create tags (a classic
# PAT with `repo`, or a fine-grained token with contents:write).

on:
  issues:
    types: [closed]
  # Manual escape hatch: after an earlier milestone ships, use this to release
  # the next one whose issues are already closed (an issue-close event will not
  # fire again on its own). The same safety rules still apply.
  workflow_dispatch:
    inputs:
      version:
        description: "Milestone version to release, e.g. 0.9.0 (all its issues must be closed)"
        required: true
        type: string

# Serialize every release attempt so two milestones can never race. A queued
# attempt re-checks the rules with fresh state when it runs.
concurrency:
  group: milestone-release
  cancel-in-progress: false

jobs:
  release:
    # Act only on a manual run or a closed issue that has a milestone.
    if: github.event_name == 'workflow_dispatch' || github.event.issue.milestone != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Decide whether to release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          ISSUE_MS_TITLE: ${{ github.event.issue.milestone.title }}
        run: |
          set -euo pipefail
          repo='${{ github.repository }}'

          # gt A B: succeeds when semver A is strictly greater than semver B.
          gt() { [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          # vmax: highest semver among the arguments.
          vmax() { printf '%s\n' "$@" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1; }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            title="${INPUT_VERSION:-}"
          else
            title="${ISSUE_MS_TITLE:-}"
          fi
          echo "Target milestone: '${title:-<none>}'"

          go=true

          if [ -z "$title" ]; then
            echo "No milestone to act on."
            go=false
          fi

          if $go && ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$title"; then
            echo "Milestone title '$title' is not a X.Y.Z version; skipping."
            go=false
          fi

          milestones='[]'
          if $go; then
            milestones=$(gh api "repos/$repo/milestones?state=all&per_page=100")
          fi

          # Rule 1: the milestone must exist and have no open issues left.
          if $go; then
            open=$(jq -r --arg t "$title" '[.[] | select(.title==$t)][0] | .open_issues // "missing"' <<<"$milestones")
            if [ "$open" = "missing" ]; then
              echo "No milestone titled '$title'; skipping."
              go=false
            elif [ "$open" != "0" ]; then
              echo "Milestone '$title' still has $open open issue(s); nothing to release yet."
              go=false
            fi
          fi

          # Baseline: the newest version already released (a vX.Y.Z tag), written
          # to the changelog, or set in pubspec. We never touch a version at or
          # below it.
          baseline="0.0.0"
          if $go; then
            maxTag=$(gh api "repos/$repo/tags?per_page=100" --jq '.[].name' \
              | sed -n 's/^v//p' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            changelog=$(gh api "repos/$repo/contents/CHANGELOG.md" -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
            maxHeader=$(printf '%s\n' "$changelog" | grep -Eo '^## [0-9]+\.[0-9]+\.[0-9]+' | sed 's/^## //' | sort -V | tail -1 || true)
            pubspec=$(gh api "repos/$repo/contents/pubspec.yaml" -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
            pubspecVer=$(printf '%s\n' "$pubspec" | sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -1 || true)
            baseline=$(vmax "0.0.0" "${maxTag:-}" "${maxHeader:-}" "${pubspecVer:-}")
            echo "latest tag='${maxTag:-none}', changelog top='${maxHeader:-none}', pubspec='${pubspecVer:-none}' -> baseline $baseline"
          fi

          # Rule 3: never release a version already released, reached, or exceeded.
          if $go && ! gt "$title" "$baseline"; then
            echo "Version $title is not newer than the current version $baseline; skipping (already released, reached, or exceeded)."
            go=false
          fi

          # Rule 4: release milestones in order. The target must be the lowest
          # milestone version still ahead of the baseline.
          if $go; then
            next=$(jq -r '.[].title' <<<"$milestones" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | while read -r v; do if gt "$v" "$baseline"; then echo "$v"; fi; done \
              | sort -V | head -1 || true)
            if [ "$title" != "$next" ]; then
              echo "Milestone $next is older than $title and not released yet; release $next first. Skipping."
              go=false
            fi
          fi

          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "version=$title" >> "$GITHUB_OUTPUT"

      - name: Require release token
        if: steps.gate.outputs.go == 'true'
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -z "${RELEASE_PAT:-}" ]; then
            echo "::error::RELEASE_PAT secret is not set. It is required so the pushed tag triggers release.yml."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Write changelog, bump versions, commit and tag
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"

          # Last-mile idempotence: never add a section that is already there.
          if grep -q "^## ${version}\$" CHANGELOG.md; then
            echo "CHANGELOG already has a ${version} section; nothing to do."
            exit 0
          fi

          # gh issue list returns issues only (no pull requests). Keep the ones
          # that were actually completed, oldest number first, and strip a
          # leading "[Type]: " so the entries read cleanly.
          gh issue list --milestone "$version" --state closed --limit 500 \
            --json number,title,url,stateReason \
            --jq 'sort_by(.number)
                  | map(select(.stateReason != "NOT_PLANNED"))
                  | .[]
                  | "* [#\(.number)](\(.url)) " + (.title | sub("^\\[.*?\\]:\\s*"; ""))' \
            > section_body.txt

          if [ ! -s section_body.txt ]; then
            echo "No completed issues found for milestone ${version}; nothing to release."
            exit 0
          fi

          {
            echo "## ${version}"
            echo
            cat section_body.txt
          } > section.md

          echo "----- new CHANGELOG section -----"
          cat section.md
          echo "---------------------------------"

          # Insert the new section right after the "# Changelog" title so the
          # newest version stays on top, matching the existing file.
          awk '
            NR==FNR { sec = sec $0 ORS; next }
            { print }
            /^# Changelog$/ && !done { printf "%s", ORS sec; done=1 }
          ' section.md CHANGELOG.md > CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

          # Keep the version identical in all three places.
          sed -i -E "s/^version: .*/version: ${version}/" pubspec.yaml
          sed -i -E "s/^const _version = '.*';/const _version = '${version}';/" lib/src/runner.dart

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md pubspec.yaml lib/src/runner.dart
          git commit -m "release ${version}"

          # Land on top of whatever else reached main since checkout, then push
          # the commit and the tag. The tag push uses RELEASE_PAT (persisted by
          # checkout), so release.yml starts; the commit push triggers nothing on
          # its own (CI does not run on pushes to main).
          git pull --rebase origin main
          git push origin HEAD:main
          git tag "v${version}"
          git push origin "v${version}"
