name: CI

# The test suite, and the single source of truth for it.
#
# It runs in exactly two situations, and never redundantly:
#   * on every pull request, as the gate that must pass before merge; and
#   * when release.yml reuses it (workflow_call) to test the exact tagged commit
#     right before publishing.
#
# It deliberately does NOT run on pushes to main. A merged pull request was
# already tested here, and the release path tests the tagged commit again before
# it ships, so a push-to-main trigger would only duplicate work that already ran.
on:
  pull_request:
    branches: [main]
  workflow_call:

# A new push to a pull request cancels any run still going for the same ref, so
# rapid iteration does not pile up runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: dart pub get
      # Golden fixtures hold deliberately unformatted code, so skip them.
      - run: dart format --output none --set-exit-if-changed $(git ls-files '*.dart' ':!test/fixtures')
      - run: dart analyze --fatal-infos
      - run: dart test
